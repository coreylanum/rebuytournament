[project]
name = "pokerleague"
version = "0.1.0"
description = "Automation for the weekly neighborhood PokerNow hold'em tournament"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
aws = [
    "anthropic[bedrock]>=2.8.0",
    "boto3>=1.34",
]
import = ["openpyxl>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",
    "boto3>=1.34",
    "anthropic[bedrock]>=2.8.0",
    "botocore[crt]>=1.43.127",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokerleague"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
