<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebuy Club</title>
  <meta name="description" content="Weekly tournament results, standings and stats.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">Rebuy Club</a>
    <nav aria-label="Main">
      <a href="#/" data-nav="standings">Standings</a>
      <a href="#/tournaments" data-nav="tournaments">Tournaments</a>
      <a href="#/knockouts" data-nav="knockouts">Knockouts</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
  </header>
  <div class="filters" role="toolbar" aria-label="Filters">
    <label>Season <select id="season"></select></label>
  </div>
  <main id="app" tabindex="-1"><p class="muted">Loading…</p></main>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
